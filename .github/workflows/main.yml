name: Build Controllable
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v3.5.0
    - name: Read modid from gradle.properties
      id: mod_id
      uses: Reedyuk/read-properties@v1.0.4
      with:
        path: './gradle.properties'
        property: 'mod_id'
    - name: Read mod version from gradle.properties
      id: mod_version
      uses: Reedyuk/read-properties@v1.0.4
      with:
        path: './gradle.properties'
        property: 'mod_version'
    - name: Read minecraft version from gradle.properties
      id: mc_version
      uses: Reedyuk/read-properties@v1.0.4
      with:
        path: './gradle.properties'
        property: 'minecraft_version'
    - name: Cache
      uses: actions/cache@v4.2.0
      with:
        path: ~/.gradle/caches
        key: gradle-minecraft-${{ steps.mc_version.outputs.value }}
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Build (Common)
      env:
        GPR_USER: "HomuHomu833"
        GPR_KEY: ${{ secrets.GPR_TOKEN }}
      run: ./gradlew :common:build
    - name: Build (Forge)
      env:
        GPR_USER: "HomuHomu833"
        GPR_KEY: ${{ secrets.GPR_TOKEN }}
      run: ./gradlew :forge:build
    - name: Stop Gradle
      run: ./gradlew --stop
    - name: Construct artifact files
      id: artifacts
      run: |
        echo "forge=forge/build/libs/${{ steps.mod_id.outputs.value }}-forge-${{ steps.mc_version.outputs.value }}-${{ steps.mod_version.outputs.value }}-release.jar" >> "$GITHUB_OUTPUT"
        echo "fabric=fabric/build/libs/${{ steps.mod_id.outputs.value }}-fabric-${{ steps.mc_version.outputs.value }}-${{ steps.mod_version.outputs.value }}-release.jar" >> "$GITHUB_OUTPUT"
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        name: '${{ steps.mc_version.outputs.value }}-${{ steps.mod_version.outputs.value }}'
        artifacts: "${{ steps.artifacts.outputs.forge }},${{ steps.artifacts.outputs.forge }}.asc,${{ steps.artifacts.outputs.fabric }},${{ steps.artifacts.outputs.fabric }}.asc,CHANGELOG.txt"
        bodyFile: "RELEASE_BODY.md"
    - name: Upload Forge Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: '${{ steps.mod_id.outputs.value }}-forge-${{ steps.mc_version.outputs.value }}-${{ steps.mod_version.outputs.value }}'
        path: |
          ${{ steps.artifacts.outputs.forge }}
          ${{ steps.artifacts.outputs.forge }}.asc
    - name: Upload Fabric Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: '${{ steps.mod_id.outputs.value }}-fabric-${{ steps.mc_version.outputs.value }}-${{ steps.mod_version.outputs.value }}'
        path: |
          ${{ steps.artifacts.outputs.fabric }}
          ${{ steps.artifacts.outputs.fabric }}.asc
